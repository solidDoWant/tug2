# Development stack for stats-api: a Postgres 18 instance laid out like
# production (old stats tables in public, stats v2 in its own stats_dev schema,
# dummy data in both), plus the API built from this directory's Dockerfile.
#
#   docker compose up --build        # start the stack
#   curl localhost:8080/readyz       # API is up and the DB is reachable
#   curl localhost:8080/api/v2/players
#   docker compose down -v           # stop and wipe the database volume
#
# testdata/init-db.sh applies the schema files and testdata/seed.sql only when
# the database volume is first created. After changing either, recreate it with
# `docker compose down -v` followed by `docker compose up`.

name: stats-api-dev

services:
  postgres:
    image: postgres:18@sha256:f5cbc081c25690710f3fc6f4c61a7565382bae01ca0d0f2028a53d7926b85a20
    environment:
      POSTGRES_DB: sourcemod-insurgency-stats
      POSTGRES_USER: insurgency
      POSTGRES_PASSWORD: insurgency
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory, so the volume
      # is mounted at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      # Run once on first initialisation of the data volume: creates stats_dev,
      # applies the old plugins' files then the stats_*.sql files (as
      # DatabaseMigrator does, one transaction per file), then the seed.
      - ../../plugins/sourcemod/configs/sql-init-scripts/pgsql:/sql:ro
      - ./testdata/seed.sql:/seed.sql:ro
      - ./testdata/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurgency -d sourcemod-insurgency-stats"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Don't count failures during initial schema load / bootstrap restart.
      start_period: 30s

  stats-api:
    build:
      context: .
      target: stats-api
    environment:
      LISTEN_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      # search_path selects the server's stats schema, as in production.
      DATABASE_URL: "postgres://insurgency:insurgency@postgres:5432/sourcemod-insurgency-stats?sslmode=disable&options=-csearch_path%3Dstats_dev"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      # Only wait for the container to start, not for the healthcheck. Docker
      # runs healthchecks via `docker exec`, which is unreliable in nested
      # Docker-in-Docker sandboxes; gating on it can wedge startup here. Instead
      # stats-api starts alongside Postgres and `restart: on-failure` retries it
      # until the schema load finishes and the DB accepts connections.
      postgres:
        condition: service_started
    restart: on-failure

volumes:
  postgres-data:

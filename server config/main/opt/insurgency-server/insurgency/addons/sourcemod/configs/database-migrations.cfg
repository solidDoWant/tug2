"Migrations"
{
    // clientprefs plugin
    "clientprefs"
    {
        "tables"  "configs/sql-init-scripts/pgsql/clientprefs-pgsql.sql"
    }

    // admin plugin
    "admins"
    {
        // This uses a local copy of the create_admins.sql script with minor modifications, see https://github.com/alliedmodders/sourcemod/issues/2373
        "tables"  "configs/sql-init-scripts/pgsql/create_admins.sql"
    }

    // LoadoutSaver plugin
    // This server runs LoadoutSaverSlots, which keeps its sets in loadouts_slots. The `loadouts`
    // table LoadoutSaver used is imported ONCE, by "import_legacy" below, and then left untouched -
    // which keeps swapping back to the original plugin a no-op. Order matters: the import needs the
    // tables, and the migrations run in the order listed here.
    //
    // loadout_saver_slots_theater_replacements.sql is deliberately absent: it remaps weapons the
    // test theater removed, and this server's theater still has them.
    "loadoutsaver"
    {
        "tables"  "configs/sql-init-scripts/pgsql/loadout_saver_slots.sql"
        "import_legacy"  "configs/sql-init-scripts/pgsql/loadout_saver_slots_import_legacy.sql"
    }

    // PunitivePersistence plugin
    "punitive-persistence"
    {
        "tables"  "configs/sql-init-scripts/pgsql/punitive_persistence.sql"
    }

    // Insurgency Stats (used by MapLogger and other plugins)
    "insurgency-stats"
    {
        "firesupport"  "configs/sql-init-scripts/pgsql/firesupport.sql"
        "d_dy_pull_rag"  "configs/sql-init-scripts/pgsql/d_dy_pull_rag.sql"
        "gg2_connection_tracker"  "configs/sql-init-scripts/pgsql/gg2_connection_tracker.sql"
        "gg2_forceretry"  "configs/sql-init-scripts/pgsql/gg2_forceretry.sql"
        "gg2_fuckyeah"  "configs/sql-init-scripts/pgsql/gg2_fuckyeah.sql"
        "gg2_medic_tracker"  "configs/sql-init-scripts/pgsql/gg2_medic_tracker.sql"
        "gg2_messages"  "configs/sql-init-scripts/pgsql/gg2_messages.sql"
        "gg2_mstats2"  "configs/sql-init-scripts/pgsql/gg2_mstats2.sql"
        "gg2_teamkill"  "configs/sql-init-scripts/pgsql/gg2_teamkill.sql"
        "map_logger"  "configs/sql-init-scripts/pgsql/map_logger.sql"
    }
}

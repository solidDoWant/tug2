// gg2_bomber overrides for the TEST server. Main keeps the plugin defaults. Any cvar not set here
// keeps its plugin default. This file is exec'd on every plugin load (AutoExecConfig), so settings
// belong here rather than in server_checkpoint.cfg, where a reload would undo them until the next
// round start.

// Average seconds between an armed bomber's yells while hunting (each gap is 75-125% of this).
// Default: "15.0"
gg_bomber_roam_interval "7"

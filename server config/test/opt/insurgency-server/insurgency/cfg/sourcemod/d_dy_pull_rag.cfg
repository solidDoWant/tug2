// ConVars for plugin "d_dy_pull_rag.smx"
//
// TEST SERVER ONLY. The plugin is compiled into the base image, so it ships to main as well, but
// sm_pullrag_toggle defaults to 0 there and main keeps the original hold-to-drag. This file is what
// makes the toggle test-only.
//
// AutoExecConfig only writes this file when it is MISSING, so adding a convar to the plugin later
// will not update it - state new settings here by hand or they silently run on code defaults.

// Sprint key behaviour for dragging bodies.
//   0 = hold the sprint key to drag (original)
//   1 = press sprint once to grab the body, press again to let go
// Either way the drag still needs the original posture: crouched, aiming at the body, within 80
// units, not walking forward and not firing. In toggle mode breaking that posture only pauses the
// drag - the body stops following and resumes when you crouch again - so a stray click does not
// silently drop it. The grab ends when you press sprint again, the body disappears, you die, or the
// body ends up more than 300 units away.
// -
// Default: "0"
sm_pullrag_toggle "1"

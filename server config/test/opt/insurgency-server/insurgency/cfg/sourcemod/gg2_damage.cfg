// gg2_damage overrides for the TEST server. Main keeps the plugin defaults (factor 2.2 per 75 units,
// lethal to 100 HP only within ~7 ft). Any cvar not set here keeps its plugin default.
//
// IED falloff: damage / factor ^ (distance / step), distance from the IED to the victim's feet.
// Target: lethal (>= 100 damage) out to 30 ft. A bomber's IED goes off at its eye height, ~64
// units, so 30 ft (480 units) horizontally is ~484 units to the victim's feet.
//
// The damage the plugin receives has already been through the engine's own radius falloff, whose
// exact curve Insurgency does not document (it replaced Source's - see old_radiusdamage). 467
// assumes the standard linear falloff over the IED's 1200-unit radius (380 -> ~227 at 484 units);
// with no engine falloff at all the same target would need 286. gg_ied_falloff_debug logs the real
// incoming damage per hit - read a hit at a known distance and recompute:
//     step = distance * ln(factor) / ln(incoming_damage / 100)

gg_ied_falloff_factor "2.2"
gg_ied_falloff_distance "467"
gg_ied_falloff_debug "0"

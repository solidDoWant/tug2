// gg2_damage overrides for the TEST server. Main keeps the plugin defaults (factor 2.2 per 75 units,
// lethal to 100 HP only within ~6 ft). Any cvar not set here keeps its plugin default.
//
// IED falloff: damage / factor ^ (distance / step), distance from the IED to the victim's feet.
// Target: lethal (>= 100 damage) out to 15 ft, between main's ~6 ft (too small) and the previous
// test value's ~30 ft (step 467, too large - issue #16).
//
// The damage the plugin receives has already been through the engine's radius falloff. From the
// server binary (CINSRules::RadiusDamage): linear, damage * (1 - d / radius), with d measured from
// the blast (+1 z) to the victim's BodyTarget, which for players is EyePosition(). For a bomber's
// IED (goes off at its eye height, ~64 units) and a standing victim h units away horizontally:
//     engine = 380 * (1 - h / 1200),  plugin distance = sqrt(h^2 + 64^2)
//     step   = plugin_distance * ln(factor) / ln(engine / 100)
// h = 240 (15 ft): engine 304, plugin distance 248 -> step 176.
// Resulting damage by distance: 6 ft 208, 10 ft 152, 15 ft 100, 20 ft 65, 30 ft 26, 40 ft 10.
// gg_ied_falloff_debug logs the real incoming damage per hit to check this in play.

gg_ied_falloff_factor "2.2"
gg_ied_falloff_distance "176"
gg_ied_falloff_debug "0"

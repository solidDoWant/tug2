// Exec'd by the game whenever the gamemode is hunt, the same way server_checkpoint.cfg is for
// checkpoint. These are all "archive" cvars, so without pinning them here they keep whatever value
// happens to be sitting in the server's config.cfg from the last time somebody changed one.
//
// This is how many enemies are alive at once, not how many the round is worth - hunt reinforcements
// (sm_hunt_bots_per_player, cfg/sourcemod/plugin.respawn.cfg) refill this pool as it is killed.
// Raising it raises the concurrent load instead: humans + bots cannot exceed maxplayers (49), and
// the human slots have to come out of that same budget.
ins_bot_count_hunt_min                        18
ins_bot_count_hunt_max                        26
ins_bot_count_hunt_default                     0    // 0 scales between min and max by player count

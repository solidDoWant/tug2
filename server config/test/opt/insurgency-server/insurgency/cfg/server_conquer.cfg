// Exec'd by the game whenever the gamemode is conquer. This exists only to pin cvars that other
// gamemodes change, since they are not reset between maps - the same reasoning as the comment at the
// top of server_hunt.cfg.

// The engine runs server_<mode>.cfg INSTEAD OF the game's own default_server_<mode>.cfg, not after
// it, so creating this file switched the stock mode settings off and let whatever the previous map's
// mode had set leak in (checkpoint's mp_supply_token_base 120 and mp_maxrounds 5, in survival's case).
// Run the stock file first so this one only has to hold the overrides.
exec default_server_conquer.cfg

sm_supply_player_tokens                 100

// Pinned to their defaults because server_survival.cfg changes them and cvars are not reset between
// maps. ins_bot_difficulty is raised by bm2_respawn's survival ramp.
mp_supply_token_max                     30
mp_supply_gain_obj_cap                  1
mp_supply_gain_kill_assist_threshold    5
mp_wave_dpr_attackers                   0.2
ins_bot_difficulty                      1

// Exec'd by the game whenever the gamemode is survival, the same way server_checkpoint.cfg is for
// checkpoint.
//
// The engine runs server_<mode>.cfg INSTEAD OF the game's own default_server_<mode>.cfg, not after
// it, so creating this file switched the stock mode settings off and let whatever the previous map's
// mode had set leak in (checkpoint's mp_supply_token_base 120 and mp_maxrounds 5, in survival's case).
// Run the stock file first so this one only has to hold the overrides.
exec default_server_survival.cfg

// STARTING SUPPLY FOR THE PLAYERS (insurgents in this mode).
//
// The engine already does the right thing here: the game's own cfg/default_server_survival.cfg (run
// above) sets mp_supply_token_base 2, because survival is meant to start you with almost nothing and
// make you take caches for the rest. What defeated that was gg2_supply, which sets m_nRecievedTokens up to
// sm_supply_player_tokens (100) on every round_start and player_team, in every gamemode. So players
// were spawning into survival with 100 supply and buying whatever they liked on wave one.
//
// gg2_supply only ever RAISES the count - "if (currentTokens >= token_count) return" - so this line
// does not fight the engine, it just stops the top-up from being generous.
//
// 15 is chosen, not guessed: the insurgent templates this theater puts on the survival cells cost
// between 4 and 12 supply for their own buy_order (the sappers with the AT4/LAW are the 12). 15
// covers the most expensive one with a little headroom and leaves nothing meaningful to spend, so
// everyone still spawns with their intended kit and nobody starts kitted out. Lower it toward 12 to
// tighten further; below about 12 the sapper templates stop being able to afford themselves.
sm_supply_player_tokens                 12

// Left alone deliberately. Bots need their supply to afford the buy_order in their class template -
// that is the whole mechanism - and the survival waves in theater_tug_nvg_default_survival.theater
// cost 3..10 each. Stock survival gives bots 20 (mp_supply_token_bot_base above), gg2_supply tops
// them to 35; both are comfortably enough.
//sm_supply_bot_tokens                  35

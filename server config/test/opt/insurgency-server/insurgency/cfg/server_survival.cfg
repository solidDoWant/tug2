// Exec'd by the game whenever the gamemode is survival, the same way server_checkpoint.cfg is for
// checkpoint.
//
// The engine runs server_<mode>.cfg INSTEAD OF the game's own default_server_<mode>.cfg, not after
// it, so creating this file switched the stock mode settings off and let whatever the previous map's
// mode had set leak in (checkpoint's mp_supply_token_base 120 and mp_maxrounds 5, in survival's case).
// Run the stock file first so this one only has to hold the overrides.
exec default_server_survival.cfg

// STARTING SUPPLY FOR THE PLAYERS (insurgents in this mode).
//
// The engine already does the right thing here: the game's own cfg/default_server_survival.cfg (run
// above) sets mp_supply_token_base 2, because survival is meant to start you with almost nothing and
// make you take caches for the rest. What defeated that was gg2_supply, which sets m_nRecievedTokens
// up to sm_supply_player_tokens (100) on every round_start and player_team, in every gamemode. So
// players were spawning into survival with 100 supply and buying whatever they liked on wave one.
//
// gg2_supply only ever RAISES the count - "if (currentTokens >= token_count) return" - so this line
// does not fight the engine, it just stops the top-up from being generous.
//
// 2, the same as mp_supply_token_base, so the floor never adds anything: a run starts on 2 supply
// and every class's default kit is a free knife and pistol (theater_tug_nvg_default_survival.theater),
// with everything else bought as it is earned.
sm_supply_player_tokens                 2

// =================================================================================================
// SUPPLY INCOME
// =================================================================================================
// Balance targets: groups of 3+ reach level 30 about half the time and level 50 about a fifth of
// the time, with a full kit affordable somewhere in the 20s-30s and upgrades still worth saving for
// at 50. Theater prices are set against roughly 2.3 supply per level for a player who is in the
// fight. What a player earns (all per player; CINSRules_Survival in server_srv.so):
//
//   +1 per level secured, alive players only        hard-coded
//   +1 more for being inside the safehouse           hard-coded
//   +1 per capture, if mp_supply_gain_obj_cap > 0    counted when the player next enters a spawn zone
//   +1 per mp_supply_gain_kill_assist_threshold kills + assists
//
// The two hard-coded awards are ~2 a level on their own, so the capture award is switched off (it
// would largely double-count the safehouse) and kills pay half as often as stock.
mp_supply_gain_obj_cap                  0
mp_supply_gain_kill_assist_threshold    10

// The cap is on supply RECEIVED over the run, not on what is left to spend, so spending does not make
// room under it. 200 is out of reach before level 50 at the rate above. Supply resets to
// mp_supply_token_base when a round ends, win or lose, and the level restarts at 1.
mp_supply_token_max                     200

// =================================================================================================
// BOTS
// =================================================================================================
// Count: the engine starts at a number set by the lobby's human count (lerp from _min at 1 player to
// _max at mp_coop_lobbysize), adds exactly 1 per level, and caps at ins_bot_count_survival_max.
// ins_bot_count_survival_level_multiplier is never read. Night maps use start_*, day maps
// day_start_*. 34 is the most that fits: -maxplayers 49, less 14 human slots, less one spare.
ins_bot_count_survival_start_min        12
ins_bot_count_survival_start_max        20
ins_bot_count_survival_day_start_min    14
ins_bot_count_survival_day_start_max    22
ins_bot_count_survival_max              34

// Reinforcement waves. The engine only sends one once the dead share of the bot team reaches BOTH
// mp_wave_dpr_attackers and a level-scaled ratio that falls from _start to _end by level 30. The
// first defaults to 0.2, which is also where the level ratio starts, so the ramp never took effect.
// Dropping it to the ramp's floor lets waves come faster as levels rise, as intended.
mp_wave_dpr_attackers                   0.1

// Bot skill. The engine blends each of these from _start at level 1 to _end at level 13 and holds
// it there. The _end values are tougher than stock (fov 1.05, recognize 0.8, aim tracking 0.9,
// attack delay 0.8). Past level 13, bm2_respawn's ramp takes over (bot_damage and ins_bot_difficulty
// by level - sm_survival_bot_* in cfg/sourcemod/plugin.respawn.cfg).
sm_cvar bot_fov_frac_survival_end               1.15
sm_cvar bot_recognizetime_frac_survival_end     0.6
sm_cvar bot_aimtracking_frac_survival_end       0.75
sm_cvar bot_attackdelay_frac_survival_end       0.6

// Every cvar above that is not survival-specific (mp_supply_*, mp_wave_dpr_attackers) is pinned back
// to its default in server_checkpoint/hunt/conquer/outpost.cfg, because cvars are not reset between
// maps and would otherwise carry into the next mode.

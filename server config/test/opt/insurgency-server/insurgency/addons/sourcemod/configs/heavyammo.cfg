// Heavy ammunition - rounds that damage, ignite and suppress everything AROUND where they land,
// rather than only what they hit. Driven by gg2_heavy_ammo.sp.
//
// One block per round. The block name is only used in logs; what identifies the round is the
// "upgrade" key, which must name a weapon upgrade in the loaded theater. That name is resolved to
// its runtime id on every map by gg2_theater_items, so nothing here goes stale when the theater is
// edited - and nothing here needs an id written into it.
//
// TO ADD A ROUND TO ANOTHER WEAPON
//
//   1. Define the ammo type and an upgrade for it in the theater, with the weapon listed in the
//      upgrade's "allowed_weapons" - that is what decides where the round can be mounted.
//   2. Add a block here naming that upgrade.
//
// No code change, and no need to touch the "weapons" key: allowed_weapons is already the gate.
// "weapons" is an optional extra filter, for when the same upgrade should only take effect on some
// of the weapons it can be mounted on. Omitted means "wherever it is mounted". It is written the
// same way the theater writes allowed_weapons, so the two read alike:
//
//     "weapons"
//     {
//         "weapon"  "weapon_m107"
//         "weapon"  "weapon_svd"
//     }
//
// A flat "weapons" "weapon_m107,weapon_svd" is accepted too.
//
// COST
//
// Effects are a one-shot particle plus a direct damage loop - no entity is spawned per round - so
// the expense is roughly one network message and a pass over connected players. "cooldown" bounds
// it per player regardless, and matters most on a high rate-of-fire weapon: the M107 is 450rpm
// semi-automatic, so 0.25 is generous for it and should be raised for anything faster.
//
// KEYS, with defaults
//
//   upgrade           (required)   theater upgrade name, e.g. "ammo_mk211_m107"
//   weapons           (all)        optional weapon classname filter; see the note above
//   radius            200          blast radius in units; damage falls off linearly to 0 at the edge
//   damage            60           damage at the centre
//   damage_type       blast        blast | burn | bullet | slash | shock
//   burn_time         0            seconds of burning; 0 disables ignition
//   burn_radius       0            how close something must be to catch fire
//   suppress_radius   0            how far bots are suppressed; 0 disables
//   suppress_arousal  12           arousal level suppressed bots are raised to
//   cooldown          0.25         minimum seconds between effects from one player
//   self_damage       1            whether the firer can be caught in their own blast
//   particle          ""           particle effect name; must be one the theater precaches
//   sound             ""           ambient sound at the impact
"HeavyAmmo"
{
	// Mk 211 Mod 0 HEIAP. A burst, not an artillery shell: lethal at the point of impact,
	// survivable at the edge, and small enough that it rewards placing the shot rather than
	// shooting near things. It carries an incendiary too, but the burst is the point.
	"mk211"
	{
		"upgrade"			"ammo_mk211_m107"
		"radius"			"260"
		"damage"			"110"
		"damage_type"		"blast"
		"burn_time"			"3.0"
		"burn_radius"		"130"
		"suppress_radius"	"500"
		"suppress_arousal"	"12"
		"cooldown"			"0.25"
		"self_damage"		"1"

		// Both effects are already referenced by the theater's explosives, so they are precached
		// and cost nothing to name here. A particle the theater does not precache will not appear.
		"particle"			"ins_m203_explosion"
		"sound"				"BaseGrenade.Explode"
	}

	// M8 API. No burst - less immediate damage over a smaller radius, but it sets things alight,
	// and burns for long enough to be worth using on a position rather than a person.
	"api"
	{
		"upgrade"			"ammo_api_m107"
		"radius"			"180"
		"damage"			"45"
		"damage_type"		"burn"
		"burn_time"			"7.0"
		"burn_radius"		"180"
		"suppress_radius"	"500"
		"suppress_arousal"	"12"
		"cooldown"			"0.25"
		"self_damage"		"1"

		"particle"			"ins_molotov_explosion"
		"sound"				"Napalm.Burn"
	}
}

// Security has TWO fire missions, on two different marker grenades:
//
//   security_smoke     weapon_m18_us      green marker   grenade_m777_us      155mm HE
//   security_wp        weapon_m18_wp_us   white marker   grenade_m777_wp_us   155mm WP
//
// FireSupport picks the type by testing the HELD weapon against the "weapon" key below with
// StrContains, FIRST MATCH WINS - and the blocks are tried in the order they appear here. The
// keys must therefore stay non-overlapping as substrings: "weapon_m18_wp_us" does not contain
// "m18_us", so the HE entry cannot swallow a WP throw. Check that again if either is renamed.
//
// The WP round, the marker grenade and its ammo entry are all declared in
// scripts/theaters/theater_tug_nvg_default.theater. The kill-feed name comes from
// resource/ui/tug2_english_wp.txt. All three are client-side.
//
// KEEP IN STEP WITH THE FASTDL CONTENT. Clients need a byte-identical copy of the theater or they
// are refused at connect, so the content image has to be published before the server that enforces
// it. `make server-image-test` builds both:
//     make server-image-test
//
// Access is gated by the marker, not by anything here: both are class_restricted and listed only
// in template_recon_security_coop's allowed_items, so only the Weapons Sgt can call either.
"FireSupport"
{
	"security_smoke"
	{
		// This config requires https://steamcommunity.com/sharedfiles/filedetails/?id=2744181131
		"weapon"				"m18_us"
		"spread"				"400.0"
		"shells"				"27"
		"delay"					"8.0"
		"duration"				"13.33"
		"jitter"				"0.3"
		"projectile"			"grenade_m777_us"
		"throw_sound"			"#request_artillery_sound"
		"success_sound"			"tug/arty_distant_1.wav"
		"fail_sound"			"#invalid_artillery_sound"
		"success_message"		"{olivedrab}[Fire Support]{default} Artillery strike inbound on your position!"
		"fail_message"			"{olivedrab}[Fire Support]{default} Unable to call artillery - invalid target location!"
		"projectile_message"	""
		"completion_message"	"{olivedrab}[Fire Support]{default} Artillery complete - {1} enemies, {3} friendlies by {2}"
		"security_count"		"12"
		"security_delay"		"0.0"
		"insurgent_count"		"0"
		"insurgent_delay"		"120.0"

		"spawn_smoke"			"1"
		"smoke_type"			"grenade_m18"
	}
	"security_wp"
	{
		// Thrown on weapon_m18_wp_us (white marker), NOT weapon_m18_us. See the note at the top of
		// this file about substring matching before renaming either.
		"weapon"				"m18_wp_us"

		// All rounds land together, as a battery firing one volley rather than a walking barrage.
		// duration is the window the whole salvo lands in; FireSupport.sp clamps the gap between
		// shells to 0.01s, so 6 rounds cannot land closer than ~0.05s apart however low this goes.
		"spread"				"350.0"
		"shells"				"6"
		"delay"					"8.0"
		"duration"				"0.1"
		"jitter"				"0.0"

		// Six rather than the HE mission's 27: each round leaves a fire field ~280 units across
		// burning for 20 seconds instead of a one-off blast, so six inside a 350 spread already
		// overlap into continuous cover. The resulting lethal area is close to the HE mission's
		// (~630 vs ~600 units of radius); what it loses is HE's much larger damage-falloff fringe.
		"projectile"			"grenade_m777_wp_us"
		"throw_sound"			"#request_artillery_sound"
		"success_sound"			"tug/arty_distant_1.wav"
		"fail_sound"			"#invalid_artillery_sound"
		"success_message"		"{olivedrab}[Fire Support]{default} Willie Pete inbound on your position - danger close, take cover!"
		"fail_message"			"{olivedrab}[Fire Support]{default} Unable to call artillery - invalid target location!"
		"projectile_message"	""

		"completion_message"	"{olivedrab}[Fire Support]{default} Rounds complete - {1} enemies, {3} friendlies by {2}"

		"security_count"		"6"
		"security_delay"		"0.0"
		"insurgent_count"		"0"
		"insurgent_delay"		"120.0"

		"spawn_smoke"			"1"
		"smoke_type"			"grenade_m18"
	}
	"insurgent_smoke"
	{
		// This config requires https://steamcommunity.com/sharedfiles/filedetails/?id=2744179612&searchtext=tug
		"weapon"				"m18_ins"
		"spread"				"200.0"
		"shells"				"8"
		"delay"					"10.0"
		"duration"				"20.0"
		"jitter"				"0.5"
		"projectile"			"grenade_m777_ins"
		"throw_sound"			"player/voice/radial/security/leader/suppressed/holdposition1.ogg"
		"success_sound"			"tug/arty_distant_1.wav"
		"fail_sound"			"buttons/button11.wav"
		"success_message"		"{deeppink}ICOM Chatter:{default} Firing rockets now"
		"fail_message"			"{deeppink}ICOM Chatter:{default} Achmed cannot find the telescope"
		"projectile_message"	"{deeppink}ICOM Chatter:{default} !!ALLAHU AKBAR!!"
		"completion_message"	"{deeppink}ICOM Chatter:{default} Strike finished - {1} infidels, {3} brothers by {2}"
		"security_count"		"0"
		"security_delay"		"0.0"
		"insurgent_count"		"0"
		"insurgent_delay"		"60.0"
		"spawn_smoke"			"1"
		"smoke_type"			"grenade_m18"
	}
}

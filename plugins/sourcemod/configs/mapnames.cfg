// Map display names, for the Discord round messages in gg2_discord.sp.
//
// WHY THIS FILE EXISTS, AND WHY IT IS NEARLY EMPTY
//
// Weapons have a display name to read - each one carries a "print_name" token that resolves in the
// mounted localisation files, which is where !listlo and the Discord TK lines get "M4A1 SOPMOD"
// from. Maps do not. Of the 133 maps in this server's mapcycle, exactly ONE has a name token
// (embassy_coop, a stock map), and only one subscribed workshop item ships an English localisation
// file at all - the TUG scripts pack, which carries no map names. Every other map here is a
// workshop map whose only name is its filename.
//
// So mapnames.inc DERIVES the name from the filename instead, by dropping everything in it that is
// not the name of the place: the gamemode (coop, pve, hunt...), build tags (b2, v1_3, coopv3b4,
// x64, tug24, 2021), the prefix saying which game a port came from (ins_, de_, cs_, pl_, l4d_) and
// the port/revision tags on the end (aof, gf, ws, fix, new, nd).
//
// That gets it right on 69 of the 70 maps in the current mapcycle - "district_night_coop" ->
// "District Night", "cs_motel_coop_nd_v1_3" -> "Motel", "warehouse_coopv3b4" -> "Warehouse" - so
// this file only needs the exceptions, which is why there are so few entries.
//
// ADDING ONE
//
//   "<map filename>"   "<display name>"
//
// The key is the map name as the server reports it, without .bsp; case does not matter. An entry
// here always wins over the derivation, so it is also the way to override a derived name that is
// correct but not what you want to show.
//
// Nothing needs to be added for a new map - an unlisted one is derived, and the derivation is
// usually right. Check a new one with the map-change message and add an entry only if it reads
// badly.
"MapNames"
{
	// The derivation splits on underscores, and this map has none between its words - there is no
	// rule that recovers "Bridge at Remagen" from one run of letters.
	"ins_bridgeatremagen_coop"	"Bridge at Remagen"

	// CANDIDATES, left out because they need somebody who knows the map to decide, not a guess:
	//
	//   dedust1p2_aof   derives to "Dedust". Almost certainly the Counter-Strike Dust, with "1p2"
	//                   a porter's revision marker - but whether it is Dust or Dust2 is a guess.
	//   dust_new        derives to "Dust", which reads oddly next to dust_open ("Dust Open").
	//   cu_chi_tunnels  derives to "Cu Chi Tunnels", correct but usually written "Củ Chi".
}

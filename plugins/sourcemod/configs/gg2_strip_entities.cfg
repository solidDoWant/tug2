// Entities removed from the entity lump before they spawn. See gg2_strip_entities.sp.
//
// Each map section holds one or more rules. A rule needs a "classname", a "key"/"value" pair, or
// both - a rule with neither is refused at load rather than stripping the whole map. Use "*" as
// the map name to apply a rule everywhere.
//
// This is for entities that reference assets the map failed to pack. A client cannot cache a
// failed material load, so it retries constantly and the framerate collapses; removing the entity
// removes the reference. It does NOT fix the map, and it can only help where an ENTITY is what
// asks for the asset - a missing material baked into brush faces or a static overlay has nothing
// to strip and needs a stub material shipped to clients instead.
//
// Generated by tools/bspaudit against the 69 maps this server subscribes to, checked against a
// content index collected from a real client. Regenerate after a map pool change:
//
//     cd tools/bspaudit
//     python3 audit.py --maps-dir <workshop content> --content-index content_index.txt \
//                      --strip-config out.cfg
//
// worldspawn is never generated and never stripped - the audit legitimately flags its
// "detailmaterial", and removing worldspawn would break the map. The plugin refuses it too.
